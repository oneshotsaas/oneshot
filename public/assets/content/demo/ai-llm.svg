<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <!-- Grid of nodes -->
  <g opacity="0.15" stroke="#a78bfa" stroke-width="1" fill="none">
    <line x1="100" y1="80"  x2="300" y2="160"/>
    <line x1="100" y1="80"  x2="200" y2="240"/>
    <line x1="300" y1="160" x2="500" y2="80"/>
    <line x1="300" y1="160" x2="400" y2="300"/>
    <line x1="500" y1="80"  x2="700" y2="160"/>
    <line x1="500" y1="80"  x2="400" y2="300"/>
    <line x1="700" y1="160" x2="600" y2="320"/>
    <line x1="200" y1="240" x2="400" y2="300"/>
    <line x1="400" y1="300" x2="600" y2="320"/>
    <line x1="200" y1="240" x2="100" y2="340"/>
    <line x1="600" y1="320" x2="700" y2="340"/>
  </g>
  <!-- Nodes -->
  <g fill="#a78bfa">
    <circle cx="100" cy="80"  r="6" opacity="0.9"/>
    <circle cx="300" cy="160" r="9" opacity="1"/>
    <circle cx="500" cy="80"  r="6" opacity="0.9"/>
    <circle cx="700" cy="160" r="6" opacity="0.8"/>
    <circle cx="200" cy="240" r="7" opacity="0.85"/>
    <circle cx="400" cy="300" r="11" opacity="1"/>
    <circle cx="600" cy="320" r="7" opacity="0.85"/>
    <circle cx="100" cy="340" r="4" opacity="0.6"/>
    <circle cx="700" cy="340" r="4" opacity="0.6"/>
  </g>
  <!-- Glow on main node -->
  <circle cx="400" cy="300" r="30" fill="#a78bfa" opacity="0.08"/>
  <circle cx="300" cy="160" r="22" fill="#a78bfa" opacity="0.07"/>
</svg>
