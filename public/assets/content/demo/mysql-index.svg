<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1a2e"/>
      <stop offset="100%" stop-color="#071020"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <!-- B-tree visualization -->
  <!-- Root node -->
  <rect x="330" y="40" width="140" height="44" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="67" font-family="monospace" font-size="13" fill="#93c5fd" text-anchor="middle">id = 500</text>
  <!-- Level 2 -->
  <rect x="130" y="140" width="140" height="44" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="200" y="167" font-family="monospace" font-size="13" fill="#93c5fd" text-anchor="middle">id = 250</text>
  <rect x="530" y="140" width="140" height="44" rx="8" fill="#1e3a5f" stroke="#3b82f6" stroke-width="1"/>
  <text x="600" y="167" font-family="monospace" font-size="13" fill="#93c5fd" text-anchor="middle">id = 750</text>
  <!-- Level 3 -->
  <rect x="40"  y="250" width="120" height="44" rx="8" fill="#172554" stroke="#1d4ed8" stroke-width="1" opacity="0.9"/>
  <text x="100" y="277" font-family="monospace" font-size="12" fill="#bfdbfe" text-anchor="middle">1 – 249</text>
  <rect x="210" y="250" width="120" height="44" rx="8" fill="#172554" stroke="#1d4ed8" stroke-width="1" opacity="0.9"/>
  <text x="270" y="277" font-family="monospace" font-size="12" fill="#bfdbfe" text-anchor="middle">251 – 499</text>
  <rect x="430" y="250" width="120" height="44" rx="8" fill="#14532d" stroke="#16a34a" stroke-width="1.5" opacity="1"/>
  <text x="490" y="277" font-family="monospace" font-size="12" fill="#86efac" text-anchor="middle">501 – 749</text>
  <rect x="620" y="250" width="120" height="44" rx="8" fill="#172554" stroke="#1d4ed8" stroke-width="1" opacity="0.9"/>
  <text x="680" y="277" font-family="monospace" font-size="12" fill="#bfdbfe" text-anchor="middle">751 – 999</text>
  <!-- Connectors -->
  <g stroke="#3b82f6" stroke-width="1.5" fill="none" opacity="0.5">
    <line x1="370" y1="84"  x2="240" y2="140"/>
    <line x1="430" y1="84"  x2="560" y2="140"/>
    <line x1="160" y1="184" x2="100" y2="250"/>
    <line x1="240" y1="184" x2="270" y2="250"/>
    <line x1="560" y1="184" x2="490" y2="250"/>
    <line x1="640" y1="184" x2="680" y2="250"/>
  </g>
  <!-- Hit indicator -->
  <text x="490" y="330" font-family="sans-serif" font-size="11" fill="#4ade80" text-anchor="middle" opacity="0.7">index hit — 3 reads</text>
  <text x="490" y="348" font-family="sans-serif" font-size="10" fill="#4ade80" text-anchor="middle" opacity="0.4">vs full scan — 1 000 000 reads</text>
</svg>
