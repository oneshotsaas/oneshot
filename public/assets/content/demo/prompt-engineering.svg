<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#134e4a"/>
      <stop offset="100%" stop-color="#042f2e"/>
    </linearGradient>
  </defs>
  <rect width="800" height="400" fill="url(#g)"/>
  <!-- Code-like lines -->
  <g font-family="monospace" font-size="13" fill="#5eead4" opacity="0.35">
    <text x="60"  y="80" >system: You are a helpful assistant.</text>
    <text x="60"  y="110">user: Summarize the following in 3 bullet</text>
    <text x="60"  y="140">      points using plain language:</text>
    <text x="60"  y="170" opacity="0.2">&#123;</text>
    <text x="60"  y="200" opacity="0.15">  "model": "claude-sonnet-4-6",</text>
    <text x="60"  y="230" opacity="0.15">  "max_tokens": 1024,</text>
    <text x="60"  y="260" opacity="0.15">&#125;</text>
    <text x="60"  y="320" opacity="0.12">assistant: Here are the key points...</text>
  </g>
  <!-- Cursor blink -->
  <rect x="60" y="325" width="8" height="14" fill="#2dd4bf" opacity="0.7" rx="1"/>
  <!-- Accent line -->
  <rect x="0" y="0" width="4" height="400" fill="#14b8a6" opacity="0.6"/>
</svg>
